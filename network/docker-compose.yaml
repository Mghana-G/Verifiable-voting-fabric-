version: '3.7'

networks:
  votingnet:
    name: voting_votingnet

volumes:
  peer0.orgiebc.example.com:
  peer0.orgjudiciary.example.com:
  peer0.orgcivilsociety.example.com:
  peer0.orgmedia.example.com:
  orderer1.orgorderer.example.com:
  orderer2.orgorderer.example.com:
  orderer3.orgorderer.example.com:

services:

  # ─── CouchDB instances ─────────────────────────────────────────────────────

  couchdb.orgiebc:
    container_name: couchdb.orgiebc
    image: ${COUCHDB_IMAGE}
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "${COUCHDB_IEBC_PORT}:5984"
    networks:
      - votingnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 10

  couchdb.orgjudiciary:
    container_name: couchdb.orgjudiciary
    image: ${COUCHDB_IMAGE}
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "${COUCHDB_JUDICIARY_PORT}:5984"
    networks:
      - votingnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 10

  couchdb.orgcivilsociety:
    container_name: couchdb.orgcivilsociety
    image: ${COUCHDB_IMAGE}
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "${COUCHDB_CIVILSOCIETY_PORT}:5984"
    networks:
      - votingnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 10

  couchdb.orgmedia:
    container_name: couchdb.orgmedia
    image: ${COUCHDB_IMAGE}
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "${COUCHDB_MEDIA_PORT}:5984"
    networks:
      - votingnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Fabric CA instances ───────────────────────────────────────────────────

  ca.orgiebc.example.com:
    container_name: ca.orgiebc.example.com
    image: ghcr.io/hyperledger/fabric-ca:${CA_VERSION}
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orgiebc
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/ca.key
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.crt
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "${CA_IEBC_PORT}:7054"
    volumes:
      - ./organizations/fabric-ca/orgiebc:/etc/hyperledger/fabric-ca-server
    networks:
      - votingnet

  ca.orgjudiciary.example.com:
    container_name: ca.orgjudiciary.example.com
    image: ghcr.io/hyperledger/fabric-ca:${CA_VERSION}
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orgjudiciary
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7064
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/ca.key
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.crt
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "${CA_JUDICIARY_PORT}:7064"
    volumes:
      - ./organizations/fabric-ca/orgjudiciary:/etc/hyperledger/fabric-ca-server
    networks:
      - votingnet

  ca.orgcivilsociety.example.com:
    container_name: ca.orgcivilsociety.example.com
    image: ghcr.io/hyperledger/fabric-ca:${CA_VERSION}
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orgcivilsociety
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7074
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/ca.key
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.crt
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "${CA_CIVILSOCIETY_PORT}:7074"
    volumes:
      - ./organizations/fabric-ca/orgcivilsociety:/etc/hyperledger/fabric-ca-server
    networks:
      - votingnet

  ca.orgmedia.example.com:
    container_name: ca.orgmedia.example.com
    image: ghcr.io/hyperledger/fabric-ca:${CA_VERSION}
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orgmedia
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7084
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/ca.key
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.crt
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "${CA_MEDIA_PORT}:7084"
    volumes:
      - ./organizations/fabric-ca/orgmedia:/etc/hyperledger/fabric-ca-server
    networks:
      - votingnet

  ca.orgorderer.example.com:
    container_name: ca.orgorderer.example.com
    image: ghcr.io/hyperledger/fabric-ca:${CA_VERSION}
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orgorderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7090
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/ca.key
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.crt
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "${CA_ORDERER_PORT}:7090"
    volumes:
      - ./organizations/fabric-ca/orgorderer:/etc/hyperledger/fabric-ca-server
    networks:
      - votingnet

  # ─── Orderers ──────────────────────────────────────────────────────────────

  orderer1.orgorderer.example.com:
    container_name: orderer1.orgorderer.example.com
    image: ghcr.io/hyperledger/fabric-orderer:${FABRIC_VERSION}
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrgOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9443
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    working_dir: /root
    command: orderer
    ports:
      - "${ORDERER1_PORT}:7050"
      - "${ORDERER1_ADMIN_PORT}:9443"
    volumes:
      - ./organizations/ordererOrganizations/orgorderer.example.com/orderers/orderer1.orgorderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orgorderer.example.com/orderers/orderer1.orgorderer.example.com/tls:/var/hyperledger/orderer/tls
      - orderer1.orgorderer.example.com:/var/hyperledger/production/orderer
    networks:
      - votingnet

  orderer2.orgorderer.example.com:
    container_name: orderer2.orgorderer.example.com
    image: ghcr.io/hyperledger/fabric-orderer:${FABRIC_VERSION}
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=8050
      - ORDERER_GENERAL_LOCALMSPID=OrgOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9444
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    working_dir: /root
    command: orderer
    ports:
      - "${ORDERER2_PORT}:8050"
      - "${ORDERER2_ADMIN_PORT}:9444"
    volumes:
      - ./organizations/ordererOrganizations/orgorderer.example.com/orderers/orderer2.orgorderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orgorderer.example.com/orderers/orderer2.orgorderer.example.com/tls:/var/hyperledger/orderer/tls
      - orderer2.orgorderer.example.com:/var/hyperledger/production/orderer
    networks:
      - votingnet

  orderer3.orgorderer.example.com:
    container_name: orderer3.orgorderer.example.com
    image: ghcr.io/hyperledger/fabric-orderer:${FABRIC_VERSION}
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=9050
      - ORDERER_GENERAL_LOCALMSPID=OrgOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9445
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    working_dir: /root
    command: orderer
    ports:
      - "${ORDERER3_PORT}:9050"
      - "${ORDERER3_ADMIN_PORT}:9445"
    volumes:
      - ./organizations/ordererOrganizations/orgorderer.example.com/orderers/orderer3.orgorderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orgorderer.example.com/orderers/orderer3.orgorderer.example.com/tls:/var/hyperledger/orderer/tls
      - orderer3.orgorderer.example.com:/var/hyperledger/production/orderer
    networks:
      - votingnet

  # ─── Peers ─────────────────────────────────────────────────────────────────

  peer0.orgiebc.example.com:
    container_name: peer0.orgiebc.example.com
    image: ghcr.io/hyperledger/fabric-peer:${FABRIC_VERSION}
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=voting_votingnet
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.orgiebc.example.com
      - CORE_PEER_ADDRESS=peer0.orgiebc.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.orgiebc.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.orgiebc.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.orgiebc.example.com:7051
      - CORE_PEER_LOCALMSPID=OrgIEBCMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.orgiebc:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - 'CORE_CHAINCODE_EXTERNALBUILDERS=[{"name":"ccaas_builder","path":"/opt/hyperledger/ccaas_builder","propagateEnvironment":["CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG"]},{"name":"node-docker","path":"/builders/node-docker"}]'
    working_dir: /root
    command: peer node start
    ports:
      - "${PEER_IEBC_PORT}:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./scripts/node-docker-builder/detect:/builders/node-docker/bin/detect:ro
      - ./scripts/node-docker-builder/build:/builders/node-docker/bin/build:ro
      - ./scripts/chaincode-run-builder.sh:/builders/node-docker/bin/run:ro
      - ./organizations/peerOrganizations/orgiebc.example.com/peers/peer0.orgiebc.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/orgiebc.example.com/peers/peer0.orgiebc.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.orgiebc.example.com:/var/hyperledger/production
    depends_on:
      couchdb.orgiebc:
        condition: service_healthy
    networks:
      - votingnet

  peer0.orgjudiciary.example.com:
    container_name: peer0.orgjudiciary.example.com
    image: ghcr.io/hyperledger/fabric-peer:${FABRIC_VERSION}
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=voting_votingnet
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.orgjudiciary.example.com
      - CORE_PEER_ADDRESS=peer0.orgjudiciary.example.com:7061
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7061
      - CORE_PEER_CHAINCODEADDRESS=peer0.orgjudiciary.example.com:7062
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7062
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.orgjudiciary.example.com:7061
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.orgjudiciary.example.com:7061
      - CORE_PEER_LOCALMSPID=OrgJudiciaryMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.orgjudiciary:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - 'CORE_CHAINCODE_EXTERNALBUILDERS=[{"name":"ccaas_builder","path":"/opt/hyperledger/ccaas_builder","propagateEnvironment":["CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG"]},{"name":"node-docker","path":"/builders/node-docker"}]'
    working_dir: /root
    command: peer node start
    ports:
      - "${PEER_JUDICIARY_PORT}:7061"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./scripts/node-docker-builder/detect:/builders/node-docker/bin/detect:ro
      - ./scripts/node-docker-builder/build:/builders/node-docker/bin/build:ro
      - ./scripts/chaincode-run-builder.sh:/builders/node-docker/bin/run:ro
      - ./organizations/peerOrganizations/orgjudiciary.example.com/peers/peer0.orgjudiciary.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/orgjudiciary.example.com/peers/peer0.orgjudiciary.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.orgjudiciary.example.com:/var/hyperledger/production
    depends_on:
      couchdb.orgjudiciary:
        condition: service_healthy
    networks:
      - votingnet

  peer0.orgcivilsociety.example.com:
    container_name: peer0.orgcivilsociety.example.com
    image: ghcr.io/hyperledger/fabric-peer:${FABRIC_VERSION}
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=voting_votingnet
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.orgcivilsociety.example.com
      - CORE_PEER_ADDRESS=peer0.orgcivilsociety.example.com:7071
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7071
      - CORE_PEER_CHAINCODEADDRESS=peer0.orgcivilsociety.example.com:7072
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7072
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.orgcivilsociety.example.com:7071
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.orgcivilsociety.example.com:7071
      - CORE_PEER_LOCALMSPID=OrgCivilSocietyMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.orgcivilsociety:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - 'CORE_CHAINCODE_EXTERNALBUILDERS=[{"name":"ccaas_builder","path":"/opt/hyperledger/ccaas_builder","propagateEnvironment":["CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG"]},{"name":"node-docker","path":"/builders/node-docker"}]'
    working_dir: /root
    command: peer node start
    ports:
      - "${PEER_CIVILSOCIETY_PORT}:7071"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./scripts/node-docker-builder/detect:/builders/node-docker/bin/detect:ro
      - ./scripts/node-docker-builder/build:/builders/node-docker/bin/build:ro
      - ./scripts/chaincode-run-builder.sh:/builders/node-docker/bin/run:ro
      - ./organizations/peerOrganizations/orgcivilsociety.example.com/peers/peer0.orgcivilsociety.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/orgcivilsociety.example.com/peers/peer0.orgcivilsociety.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.orgcivilsociety.example.com:/var/hyperledger/production
    depends_on:
      couchdb.orgcivilsociety:
        condition: service_healthy
    networks:
      - votingnet

  peer0.orgmedia.example.com:
    container_name: peer0.orgmedia.example.com
    image: ghcr.io/hyperledger/fabric-peer:${FABRIC_VERSION}
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=voting_votingnet
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.orgmedia.example.com
      - CORE_PEER_ADDRESS=peer0.orgmedia.example.com:7081
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7081
      - CORE_PEER_CHAINCODEADDRESS=peer0.orgmedia.example.com:7082
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7082
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.orgmedia.example.com:7081
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.orgmedia.example.com:7081
      - CORE_PEER_LOCALMSPID=OrgMediaMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.orgmedia:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - 'CORE_CHAINCODE_EXTERNALBUILDERS=[{"name":"ccaas_builder","path":"/opt/hyperledger/ccaas_builder","propagateEnvironment":["CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG"]},{"name":"node-docker","path":"/builders/node-docker"}]'
    working_dir: /root
    command: peer node start
    ports:
      - "${PEER_MEDIA_PORT}:7081"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./scripts/node-docker-builder/detect:/builders/node-docker/bin/detect:ro
      - ./scripts/node-docker-builder/build:/builders/node-docker/bin/build:ro
      - ./scripts/chaincode-run-builder.sh:/builders/node-docker/bin/run:ro
      - ./organizations/peerOrganizations/orgmedia.example.com/peers/peer0.orgmedia.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/orgmedia.example.com/peers/peer0.orgmedia.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.orgmedia.example.com:/var/hyperledger/production
    depends_on:
      couchdb.orgmedia:
        condition: service_healthy
    networks:
      - votingnet

  # ─── CLI ───────────────────────────────────────────────────────────────────

  cli:
    container_name: cli
    image: ghcr.io/hyperledger/fabric-peer:${FABRIC_VERSION}
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_LOCALMSPID=OrgIEBCMSP
      - CORE_PEER_ADDRESS=peer0.orgiebc.example.com:7051
      - CORE_PEER_TLS_ROOTCERT_FILE=/organizations/peerOrganizations/orgiebc.example.com/peers/peer0.orgiebc.example.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/organizations/peerOrganizations/orgiebc.example.com/users/Admin@orgiebc.example.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - ./organizations:/organizations
      - ./channel-artifacts:/channel-artifacts
      - ../chaincode:/chaincode
    depends_on:
      - peer0.orgiebc.example.com
      - peer0.orgjudiciary.example.com
      - peer0.orgcivilsociety.example.com
      - peer0.orgmedia.example.com
    networks:
      - votingnet
